; Marketplace listings carry high-res photos and short videos.
; These sit above the app's own caps (config/verum_media.php) so an
; oversized file reaches Laravel and gets a clear message, instead of
; being dropped by PHP with an empty request.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 96M
max_execution_time = 120

expose_php = Off
date.timezone = UTC

; Surface everything while developing.
error_reporting = E_ALL
display_errors = On
log_errors = On

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
